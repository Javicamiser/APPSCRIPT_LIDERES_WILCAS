<style>

/* === VARIABLES CORPORATIVAS === */

  --au-g50: #F8FAFC;
  --au-g100: #F1F5F9;
  --au-g200: #E2E8F0;
  --au-g300: #CBD5E1;
  --au-g400: #94A3B8;
  --au-g500: #64748B;
  --au-g600: #475569;
  --au-g700: #334155;

  --au-amber-b: #FDE68A;

}
@keyframes auFadeIn {

/* === HEADER === */
.au-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--au-g200);
}
.au-header-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;

  align-items: center;
  justify-content: center;

  flex-shrink: 0;
}
.au-header-icon svg { width: 24px; height: 24px; color: #fff; }
.au-header h2 {
  font-size: 24px;
  font-weight: 700;
  color: var(--au-dark);
  margin: 0;

}
.au-header p {
  font-size: 14px;
  color: var(--au-g500);

}

/* === KPI CARDS (estilo Dashboard) === */
.au-kpi-grid {

}
.au-kpi-icon {

  height: 44px;

  align-items: center;

}
.au-kpi-icon svg { width: 22px; height: 22px; }
.au-kpi-icon.orange { background: var(--au-primary-50); border: 1px solid var(--au-primary-200); }
.au-kpi-icon.orange svg { color: var(--au-primary); }
.au-kpi-icon.teal { background: var(--au-teal-bg); border: 1px solid var(--au-teal-b); }
.au-kpi-icon.teal svg { color: var(--au-teal); }
.au-kpi-icon.blue { background: var(--au-blue-bg); border: 1px solid var(--au-blue-b); }
.au-kpi-icon.blue svg { color: var(--au-blue); }
.au-kpi-icon.amber { background: var(--au-amber-bg); border: 1px solid var(--au-amber-b); }
.au-kpi-icon.amber svg { color: var(--au-amber); }
.au-kpi-icon.rose { background: var(--au-rose-bg); border: 1px solid var(--au-rose-b); }
.au-kpi-icon.rose svg { color: var(--au-rose); }
.au-kpi-icon.purple { background: #F5F3FF; border: 1px solid #DDD6FE; }
.au-kpi-icon.purple svg { color: #7C3AED; }

.au-kpi-data { flex: 1; }
.au-kpi-val {

.au-fg label {

.au-btn-clear {

/* === TABLE === */
.au-table-card {

  box-shadow: var(--au-shadow);
}
.au-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.au-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }

}

.au-badge.llamado { background: var(--au-blue-bg); color: var(--au-blue); border: 1px solid var(--au-blue-b); }

.au-actions { white-space: nowrap; display: flex; gap: 5px; align-items: center; }
.au-act {

  height: 32px;
  border-radius: var(--au-radius-sm);
  border: 1px solid var(--au-g200);

  transition: var(--au-transition);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.au-act svg { width: 15px; height: 15px; color: var(--au-g500); }
.au-act:hover { background: var(--au-primary-bg); border-color: var(--au-primary-200); }
.au-act:hover svg { color: var(--au-primary); }
.au-act.email-btn svg { color: var(--au-blue); }
.au-act.email-btn:hover { background: var(--au-blue-bg); border-color: var(--au-blue-b); }

/* PAGINATION */
.au-pag {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  border-top: 1px solid var(--au-g200);
  background: var(--au-g50);
  flex-wrap: wrap;
  gap: 10px;
}
.au-pag-btn {
  padding: 8px 18px;
  border: 1.5px solid var(--au-g200);
  border-radius: var(--au-radius-sm);
  background: var(--au-white);
  color: var(--au-g600);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--au-transition);
  font-family: var(--au-font);
}
.au-pag-btn:hover:not(:disabled) { background: var(--au-primary-bg); border-color: var(--au-primary); color: var(--au-primary); }
.au-pag-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.au-pag-info { font-size: 12px; color: var(--au-g500); font-weight: 500; }

/* EXPORT */
.au-export { margin-top: 16px; }
.au-exp-btn {
  padding: 9px 20px;
  border: 1.5px solid var(--au-g200);
  border-radius: var(--au-radius-sm);
  background: var(--au-white);
  color: var(--au-g700);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--au-transition);
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--au-font);
}
.au-exp-btn:hover { background: var(--au-primary-bg); border-color: var(--au-primary); color: var(--au-primary); }
.au-exp-btn svg { width: 15px; height: 15px; }

/* EMPTY */
.au-empty { text-align: center; padding: 60px 20px; }
.au-empty svg { width: 48px; height: 48px; color: var(--au-g300); margin-bottom: 10px; }
.au-empty p { font-size: 14px; color: var(--au-g400); margin: 0; }

/* ================================================================
   MODALES (mismo estilo empresarial)
   ================================================================ */
.au-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(15, 23, 42, 0.45);
  backdrop-filter: blur(4px);
  z-index: 10000;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  animation: auOverIn 0.2s ease;
}
@keyframes auOverIn { from { opacity: 0; } to { opacity: 1; } }

.au-modal {
  background: var(--au-white);
  border-radius: var(--au-radius-lg);
  width: 100%;
  box-shadow: var(--au-shadow-lg), 0 0 0 1px rgba(15,23,42,0.04);
  animation: auModalIn 0.25s ease-out;
  display: flex; flex-direction: column;
  max-height: 90vh;
}
@keyframes auModalIn { from { opacity: 0; transform: scale(0.97) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.au-modal.w800 { max-width: 820px; }
.au-modal.w960 { max-width: 960px; }

.au-modal-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 28px;
  border-bottom: 1px solid var(--au-g200);
  flex-shrink: 0;
}
.au-modal-head h3 {
  font-size: 18px; font-weight: 700; color: var(--au-dark); margin: 0;
  display: flex; align-items: center; gap: 12px;
}
.au-modal-hicon {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--au-primary), var(--au-primary-light));
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.au-modal-hicon svg { width: 18px; height: 18px; color: #fff; }
.au-modal-x {
  width: 34px; height: 34px; border-radius: 8px;
  border: 1px solid var(--au-g200); background: var(--au-white);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: var(--au-transition); color: var(--au-g400); flex-shrink: 0;
}
.au-modal-x:hover { background: var(--au-rose-bg); color: var(--au-rose); border-color: var(--au-rose-b); }
.au-modal-body { padding: 28px; overflow-y: auto; flex: 1; }
.au-modal-foot {
  display: flex; justify-content: flex-end; gap: 10px;
  padding: 16px 28px; border-top: 1px solid var(--au-g200);
  background: var(--au-g50); border-radius: 0 0 var(--au-radius-lg) var(--au-radius-lg);
  flex-shrink: 0; flex-wrap: wrap;
}

/* DETAIL FIELDS */
.au-det-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 600px) { .au-det-grid { grid-template-columns: 1fr; } }
.au-det-f label {
  display: block; font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.7px; color: var(--au-g400); margin-bottom: 4px;
}
.au-det-v {
  padding: 10px 14px; background: var(--au-g50); border: 1px solid var(--au-g200);
  border-radius: var(--au-radius-sm); font-size: 13px; color: var(--au-dark);
  min-height: 40px; word-break: break-word;
}
.au-det-v.empty { color: var(--au-g400); font-style: italic; }

/* FORM FIELDS */
.au-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 600px) { .au-form-grid { grid-template-columns: 1fr; } }
.au-ff { margin-bottom: 0; }
.au-ff.full { grid-column: 1 / -1; }
.au-ff label {
  display: block; font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.6px; color: var(--au-g600); margin-bottom: 5px;
}
.au-ff input, .au-ff select, .au-ff textarea {
  width: 100%; padding: 10px 14px; border: 1.5px solid var(--au-g200);
  border-radius: var(--au-radius-sm); font-size: 13px; color: var(--au-dark);
  background: var(--au-white); transition: var(--au-transition); font-family: var(--au-font);
}
.au-ff input:focus, .au-ff select:focus, .au-ff textarea:focus {
  outline: none; border-color: var(--au-primary); box-shadow: 0 0 0 3px rgba(217,95,14,0.08);
}
.au-ff textarea { min-height: 80px; resize: vertical; }

/* BUTTONS */
.au-btn {
  padding: 10px 22px; border-radius: var(--au-radius-sm); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: var(--au-transition); border: 1.5px solid transparent;
  font-family: var(--au-font); display: inline-flex; align-items: center; gap: 7px;
}
.au-btn svg { width: 15px; height: 15px; }
.au-btn.primary { background: var(--au-primary); color: #fff; border-color: var(--au-primary); }
.au-btn.primary:hover { background: var(--au-primary-hover); }
.au-btn.secondary { background: var(--au-white); color: var(--au-g700); border-color: var(--au-g300); }
.au-btn.secondary:hover { background: var(--au-g100); }
.au-btn.danger { background: var(--au-rose-bg); color: var(--au-rose); border-color: var(--au-rose-b); }
.au-btn.danger:hover { background: #FFE4E6; }
.au-btn.info { background: var(--au-blue-bg); color: var(--au-blue); border-color: var(--au-blue-b); }
.au-btn.info:hover { background: #DBEAFE; }
.au-btn.success { background: var(--au-teal-bg); color: var(--au-teal); border-color: var(--au-teal-b); }
.au-btn.success:hover { background: #CCFBF1; }

/* SIMPATIZANTES TABLE */
.au-simp-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.au-simp-tbl thead th {
  padding: 10px 14px; text-align: left; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.6px; color: var(--au-g500);
  background: var(--au-g50); border-bottom: 2px solid var(--au-g200);
}
.au-simp-tbl tbody tr { border-bottom: 1px solid var(--au-g100); }
.au-simp-tbl tbody tr:hover { background: var(--au-primary-bg); }
.au-simp-tbl tbody td { padding: 9px 14px; color: var(--au-dark); }
.au-simp-stats { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.au-simp-st {
  padding: 8px 16px; background: var(--au-g50); border: 1px solid var(--au-g200);
  border-radius: var(--au-radius-sm); font-size: 12px; font-weight: 600; color: var(--au-g600);
}
.au-simp-st strong { color: var(--au-primary); }

/* TOAST */
.au-toast {
  position: fixed; top: 20px; right: 20px; z-index: 99999;
  padding: 14px 22px; border-radius: var(--au-radius); font-size: 13px; font-weight: 600;
  box-shadow: var(--au-shadow-lg); animation: auToastIn 0.3s ease-out;
  font-family: var(--au-font); max-width: 420px;
}
@keyframes auToastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
@keyframes auSpin { to { transform: rotate(360deg); } }
.au-toast.success { background: #F0FDFA; color: #0D9488; border: 1px solid #99F6E4; }
.au-toast.error { background: #FFF1F2; color: #BE123C; border: 1px solid #FECDD3; }
.au-toast.info { background: #EFF6FF; color: #1D4ED8; border: 1px solid #BFDBFE; }

function escH(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'):''}

function obtVU(campo){
  var v={},f=datosLlamadas||[];
  for(var i=0;i<f.length;i++){
    var val='';
    if(campo==='entidad')val=normalizarEntidad(f[i][campo]);
    else val=(f[i][campo]||'').toString().trim();
    if(val)v[val]=true;
  }
  return Object.keys(v).sort();
}

// Campos clave que deben estar completos
// Campos de la hoja BD-lideres que se verifican para datos incompletos
// Mapeados 1:1 con las columnas del Google Sheet
var _AU_CAMPOS_CLAVE = [
  'fechaNacimiento','celular','direccion','barrio','correo',
  'profesion','entidad','cargo','tipoVinculacion','horarios',
  'salario','conoceJuanFelipe','liderBarrio','expectativasProyecto',
  'estudios','numeroHijos','deporte','tieneVehiculo',
  'municipio','comuna'
];
var _AU_LABELS = {
  fechaNacimiento:'Fecha Nacimiento',celular:'Celular',direccion:'Direccion',
  barrio:'Barrio',correo:'Correo',profesion:'Profesion',entidad:'Entidad',
  cargo:'Cargo',tipoVinculacion:'Vinculacion',horarios:'Horarios',
  salario:'Salario',conoceJuanFelipe:'Conoce J.F. Alvarez',
  liderBarrio:'Lider Barrio/Comuna',expectativasProyecto:'Expectativas',
  estudios:'Estudios',numeroHijos:'Hijos',deporte:'Deporte',
  tieneVehiculo:'Vehiculo',municipio:'Municipio',comuna:'Comuna'
};

// Detecta si un líder tiene campos clave vacíos
function _auEsIncompleto(d){
  for(var i=0;i<_AU_CAMPOS_CLAVE.length;i++){
    var v=(d[_AU_CAMPOS_CLAVE[i]]||'').toString().trim();
    if(!v||v==='undefined'||v==='null')return true;
  }
  return false;
}

// Devuelve array con nombres de campos vacíos
function _auCamposVacios(d){
  var vacios=[];
  for(var i=0;i<_AU_CAMPOS_CLAVE.length;i++){
    var v=(d[_AU_CAMPOS_CLAVE[i]]||'').toString().trim();
    if(!v||v==='undefined'||v==='null')vacios.push(_AU_LABELS[_AU_CAMPOS_CLAVE[i]]||_AU_CAMPOS_CLAVE[i]);
  }
  return vacios;
}

function mostrarToastAud(msg,tipo){
  if(typeof mostrarAlertaGlobal==='function'){mostrarAlertaGlobal(msg,tipo);return}
  var ex=document.querySelectorAll('.au-toast');for(var e=0;e<ex.length;e++)ex[e].remove();
  var t=document.createElement('div');t.className='au-toast '+(tipo||'info');t.textContent=msg;
  document.body.appendChild(t);setTimeout(function(){if(t.parentNode)t.remove()},4000);
}

// ================================================================
// RENDER KPIs (zona dinámica)
// ================================================================
function _auRenderKPIs(){
  var z=document.getElementById('_auKpiZone');if(!z)return;
  var datos=datosLlamadasFiltrados;
  var ct=0,pe=0,nc=0,ll=0;
  for(var i=0;i<datos.length;i++){
    var e=(datos[i].estadoLlamada||'pendiente').toLowerCase().trim();
    if(e==='contactado')ct++;else if(e==='llamado')ll++;else if(e==='no contesta')nc++;else pe++;
  }
  z.innerHTML='<div class="au-kpi-grid">'+
    '<div class="au-kpi"><div class="au-kpi-icon orange">'+IC.usrs+'</div><div class="au-kpi-data"><div class="au-kpi-val">'+datos.length+'</div><div class="au-kpi-lbl">Total</div></div></div>'+
    '<div class="au-kpi"><div class="au-kpi-icon teal">'+IC.check+'</div><div class="au-kpi-data"><div class="au-kpi-val">'+ct+'</div><div class="au-kpi-lbl">Contactados</div></div></div>'+
  '</div>';

  // Tarjeta de datos incompletos (estilo KPI enterprise)
  var incTotal=0;
  for(var j=0;j<datosLlamadas.length;j++){
    if(_auEsIncompleto(datosLlamadas[j]))incTotal++;
  }
  var bz=document.getElementById('_auIncompleteZone');
  if(!bz)return;
  if(incTotal>0){
    var isActive=(_auKpiFilterActive==='incompletos');
    var pct=Math.round((incTotal/datosLlamadas.length)*100);
    bz.innerHTML='<div onclick="_auToggleIncompletos()" class="au-kpi" style="cursor:pointer;margin-bottom:16px;border-color:'+(isActive?'#7C3AED':'var(--au-g200)')+';'+(isActive?'box-shadow:0 0 0 2px rgba(124,58,237,0.15),var(--au-shadow-md);transform:translateY(-2px);':'')+'">'+
      '<div class="au-kpi-icon purple">'+IC.alert+'</div>'+
      '<div class="au-kpi-data">'+
        '<div class="au-kpi-val" style="color:#7C3AED;">'+incTotal+'</div>'+
        '<div class="au-kpi-lbl"'+(isActive?' style="color:#7C3AED;"':'')+'>Datos Incompletos</div>'+
      '</div>'+
      '<div style="flex:none;display:flex;align-items:center;gap:12px;">'+
        '<span style="font-size:20px;font-weight:800;color:#7C3AED;">'+pct+'%</span>'+
        '<span style="padding:6px 16px;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:0.3px;color:'+(isActive?'white':'#7C3AED')+';background:'+(isActive?'#7C3AED':'#F5F3FF')+';border:1px solid '+(isActive?'#7C3AED':'#DDD6FE')+';transition:all .2s ease;">'+(isActive?'Quitar filtro':'Ver listado')+'</span>'+
      '</div>'+
    '</div>';
  }else{
    bz.innerHTML='';
  }
}

// ================================================================
// TOGGLE FILTRO DATOS INCOMPLETOS
// ================================================================
function _auToggleIncompletos(){
  if(_auKpiFilterActive==='incompletos'){
    _auKpiFilterActive='';
    datosLlamadasFiltrados=datosLlamadas.slice();
  }else{
    _auKpiFilterActive='incompletos';
    datosLlamadasFiltrados=datosLlamadas.filter(function(d){return _auEsIncompleto(d);});
  }
  var fn=document.getElementById('filtroNombreAud');if(fn)fn.value='';
  var fe=document.getElementById('filtroEntidadAud');if(fe)fe.value='';
  var fc=document.getElementById('filtroComunaAud');if(fc)fc.value='';
  paginaAuditoria=1;
  _auRenderKPIs();
  _auRenderTable();
}

// ================================================================
// RENDER TABLE (zona dinámica — no toca filtros)
// ================================================================
function _auRenderTable(){
  var z=document.getElementById('_auTableZone');if(!z)return;
  var datos=datosLlamadasFiltrados;
  var tp=Math.ceil(datos.length/porPaginaAuditoria);
  if(paginaAuditoria>tp&&tp>0)paginaAuditoria=1;
  var ini=(paginaAuditoria-1)*porPaginaAuditoria;
  var fin=Math.min(ini+porPaginaAuditoria,datos.length);
  var pag=datos.slice(ini,fin);

  var h='<div class="au-table-card"><div class="au-table-wrap"><table class="au-tbl" id="tablaAuditoria"><thead><tr>';
  h+='<th>#</th><th>Nombre</th><th>Documento</th><th>Celular</th><th>Entidad</th><th>Comuna</th><th>Simp.</th><th>Estado</th><th>Acciones</th>';
  h+='</tr></thead><tbody>';

  for(var i=0;i<pag.length;i++){
    var d=pag[i],est=(d.estadoLlamada||'pendiente').toLowerCase().trim();
    var bc=est==='contactado'?'contactado':est==='llamado'?'llamado':est==='no contesta'?'no-contesta':'pendiente';
    var sc=(d.cantidadSimpatizantes||0)>=40?'ok':'no';
    var ix=ini+i;
    var de=escH(d.documento||''),ne=escH((d.nombre||'').replace(/'/g,'')),ce=escH((d.correo||'').replace(/'/g,''));

    h+='<tr>';
    h+='<td>'+(ix+1)+'</td>';
    h+='<td class="au-td-name">'+escH(d.nombre||'')+'</td>';
    h+='<td class="au-td-doc">'+escH(d.documento||'')+'</td>';
    h+='<td style="font-size:12px;color:var(--au-g600);">'+escH(d.celular||'')+'</td>';
    h+='<td class="au-td-ent">'+escH(truncarTexto(normalizarEntidad(d.entidad),25))+'</td>';
    h+='<td>'+escH(d.comuna||'')+'</td>';
    h+='<td class="au-td-simp '+sc+'">'+(d.cantidadSimpatizantes||0)+'</td>';
    h+='<td><span class="au-badge '+bc+'">'+est+'</span></td>';
    h+='<td><div class="au-actions">';
    h+='<button class="au-act" title="Ver" onclick="verDetalleLider('+i+','+ini+')">'+IC.eye+'</button>';
    h+='<button class="au-act" title="Editar" onclick="editarLiderAuditoria('+i+','+ini+')">'+IC.edit+'</button>';
    h+='<button class="au-act" title="Simpatizantes" onclick="verSimpatizantesLider(\''+de+'\',\''+ne+'\')">'+IC.usrs+'</button>';
    h+='<button class="au-act email-btn" title="Enviar correo" onclick="enviarCorreoLiderAud(\''+de+'\',\''+ne+'\',\''+ce+'\')">'+IC.mail+'</button>';
    h+='</div></td></tr>';

    // Mostrar campos faltantes cuando el filtro incompletos está activo
    if(_auKpiFilterActive==='incompletos'){
      var vacios=_auCamposVacios(d);
      if(vacios.length>0){
        h+='<tr style="border-bottom:1px solid var(--au-g100);"><td colspan="9" style="padding:4px 16px 8px;background:#F5F3FF;border-top:none;">';
        h+='<span style="font-size:11px;color:#7C3AED;font-weight:600;">Campos vacios: </span>';
        for(var v=0;v<vacios.length;v++){
          h+='<span style="display:inline-block;padding:2px 8px;margin:2px 3px;background:#EDE9FE;color:#6D28D9;font-size:10px;font-weight:600;border-radius:10px;border:1px solid #DDD6FE;">'+vacios[v]+'</span>';
        }
        h+='</td></tr>';
      }
    }
  }

  if(!pag.length) h+='<tr><td colspan="9"><div class="au-empty">'+IC.usrs+'<p>No se encontraron resultados</p></div></td></tr>';

  h+='</tbody></table></div>';
  h+='<div class="au-pag">';
  h+='<button class="au-pag-btn" onclick="cambiarPaginaAuditoria('+(paginaAuditoria-1)+')"'+(paginaAuditoria<=1?' disabled':'')+'>Anterior</button>';
  h+='<span class="au-pag-info">Pagina '+paginaAuditoria+' de '+(tp||1)+' &middot; '+datos.length+' registros</span>';
  h+='<button class="au-pag-btn" onclick="cambiarPaginaAuditoria('+(paginaAuditoria+1)+')"'+(paginaAuditoria>=tp?' disabled':'')+'>Siguiente</button>';
  h+='</div></div>';
  z.innerHTML=h;
}

// ================================================================
// DEBOUNCE para búsqueda (no pierde foco)
// ================================================================
function _auFiltroDebounce(){
  if(_auDebounce)clearTimeout(_auDebounce);
  _auDebounce=setTimeout(function(){filtrarAuditoria();},200);
}

// ================================================================
// FILTROS
// ================================================================
function filtrarAuditoria(){
  _auKpiFilterActive=''; // Reset KPI filter when using manual filters
  var n=document.getElementById('filtroNombreAud')?document.getElementById('filtroNombreAud').value.toUpperCase():'';
  var en=document.getElementById('filtroEntidadAud')?document.getElementById('filtroEntidadAud').value:'';
  var co=document.getElementById('filtroComunaAud')?document.getElementById('filtroComunaAud').value:'';

  datosLlamadasFiltrados=datosLlamadas.filter(function(d){
    if(n&&(d.nombre||'').toUpperCase().indexOf(n)===-1&&(d.documento||'').indexOf(n)===-1)return false;
    if(en&&normalizarEntidad(d.entidad)!==en)return false;
    if(co&&(d.comuna||'')!==co)return false;
    return true;
  });
  paginaAuditoria=1;
  _auRenderKPIs();
  _auRenderTable();
}

function limpiarFiltrosAuditoria(){
  _auKpiFilterActive='';
  var fn=document.getElementById('filtroNombreAud');if(fn)fn.value='';
  var fe=document.getElementById('filtroEntidadAud');if(fe)fe.value='';
  var fc=document.getElementById('filtroComunaAud');if(fc)fc.value='';
  datosLlamadasFiltrados=datosLlamadas.slice();
  paginaAuditoria=1;
  _auRenderKPIs();
  _auRenderTable();
}

function cambiarPaginaAuditoria(p){
  var t=Math.ceil(datosLlamadasFiltrados.length/porPaginaAuditoria);
  if(p<1||p>t)return;
  paginaAuditoria=p;
  _auRenderTable();
}

// ================================================================
// VER DETALLE
// ================================================================
function verDetalleLider(idx,offset){
  var d=datosLlamadasFiltrados[offset+idx];if(!d)return;
  mostrarLoading('Cargando detalle...');
  google.script.run.withSuccessHandler(function(r){
    ocultarLoading();var lider=d;
    if(r&&r.success&&r.datos){for(var i=0;i<r.datos.length;i++){if(String(r.datos[i].documento).trim()===String(d.documento).trim()){lider=r.datos[i];break;}}}
    mostrarModalDetalleLider(lider);
  }).withFailureHandler(function(){ocultarLoading();mostrarModalDetalleLider(d);}).obtenerDatosLlamadasWrapper();
}

function _fd(l,v){var em=!v||v===''||v==='undefined'||v==='null';return '<div class="au-det-f"><label>'+l+'</label><div class="au-det-v'+(em?' empty':'')+'">'+(em?'Sin informacion':escH(String(v)))+'</div></div>';}

function mostrarModalDetalleLider(d){
  cerrarModalAud('modalDetalleLider');
  var m=document.createElement('div');m.id='modalDetalleLider';m.className='au-overlay';
  var b='<div class="au-det-grid">';
  b+=_fd('Nombre',d.nombre)+_fd('Documento',(d.tipoDocumento||'CC')+' '+(d.documento||''));
  b+=_fd('Celular',d.celular)+_fd('Correo',d.correo);
  b+=_fd('Direccion',d.direccion)+_fd('Barrio',d.barrio);
  b+=_fd('Entidad',d.entidad)+_fd('Cargo',d.cargo);
  b+=_fd('Municipio',d.municipio)+_fd('Comuna',d.comuna);

function descargarPDFLiderCompleto(doc,nom){

  mostrarLoading('Preparando PDF...');
  google.script.run.withSuccessHandler(function(r){ocultarLoading();if(r&&r.success){window._ultSimps=r.simpatizantes||[];window._ultLD=doc;generarPDFCompleto(nom,doc,r.simpatizantes||[]);}else mostrarToastAud('Error: '+(r?r.message:''),'error');}).withFailureHandler(function(e){ocultarLoading();mostrarToastAud('Error: '+e.message,'error');}).obtenerSimpatizantesDelLider(doc);
}

function generarPDFCompleto(nomL,docL,simps){
  try{
    var jsPDF=window.jspdf.jsPDF;
    var doc=new jsPDF('p','mm','letter');
    var pw=doc.internal.pageSize.getWidth();
    var ph=doc.internal.pageSize.getHeight();
    var mx=16; // margen
    var cw=pw-mx*2; // ancho contenido
    var fc=new Date().toLocaleDateString('es-CO',{year:'numeric',month:'long',day:'numeric'});

    // Buscar datos completos del líder
    var ld=null;
    for(var i=0;i<datosLlamadas.length;i++){
      if(String(datosLlamadas[i].documento).trim()===String(docL).trim()){ld=datosLlamadas[i];break;}
    }

    // =============================================
    // HEADER — Banner naranja con degradado
    // =============================================
    doc.setFillColor(217,95,14);
    doc.rect(0,0,pw,32,'F');
    // Línea inferior decorativa
    doc.setFillColor(180,75,8);
    doc.rect(0,32,pw,1.5,'F');
    // Línea fina de acento
    doc.setFillColor(249,115,22);
    doc.rect(0,33.5,pw,0.5,'F');

    // Texto header
    doc.setTextColor(255,255,255);
    doc.setFontSize(20);
    doc.setFont('helvetica','bold');
    doc.text('SISTEMA 40 CALDAS',mx,15);
    doc.setFontSize(10);
    doc.setFont('helvetica','normal');
    doc.text('Reporte de Lider y Simpatizantes',mx,23);
    doc.setFontSize(9);
    doc.text(fc,pw-mx,15,{align:'right'});
    doc.setFontSize(8);
    doc.text('Documento: '+docL,pw-mx,22,{align:'right'});

    // =============================================
    // SECCIÓN: DATOS DEL LÍDER
    // =============================================
    var y=44;

    // Título sección con línea
    doc.setTextColor(217,95,14);
    doc.setFontSize(12);
    doc.setFont('helvetica','bold');
    doc.text('DATOS DEL LIDER',mx,y);
    doc.setDrawColor(254,215,170);
    doc.setLineWidth(0.8);
    doc.line(mx,y+2,pw-mx,y+2);
    y+=10;

    // Card con fondo gris claro para datos
    var cardH=48;
    doc.setFillColor(248,250,252);
    doc.setDrawColor(226,232,240);
    doc.setLineWidth(0.3);
    doc.roundedRect(mx,y,cw,cardH,3,3,'FD');

    // Datos en grid 2 columnas
    var campos=[
      ['Nombre',nomL||(ld?ld.nombre:'')],
      ['Documento',(ld?ld.tipoDocumento||'CC':'CC')+' '+docL],
      ['Celular',ld?ld.celular:''],
      ['Correo',ld?ld.correo:''],
      ['Entidad',ld?ld.entidad:''],
      ['Cargo',ld?ld.cargo:''],
      ['Municipio',ld?ld.municipio:''],
      ['Comuna',ld?ld.comuna:''],
      ['Barrio',ld?ld.barrio:''],
      ['Estado',ld?ld.estadoLlamada:'']
    ];

    var cx=mx+6,cy=y+6;
    var colW=(cw-12)/2;
    for(var c=0;c<campos.length;c++){
      var col=c%2;var row=Math.floor(c/2);
      var px=cx+col*colW;
      var py=cy+row*9;
      // Label
      doc.setFont('helvetica','bold');
      doc.setTextColor(148,163,184);
      doc.setFontSize(7);
      doc.text(campos[c][0].toUpperCase(),px,py);
      // Value
      doc.setFont('helvetica','normal');
      doc.setTextColor(30,41,59);
      doc.setFontSize(9.5);
      doc.text(String(campos[c][1]||'-').substring(0,45),px,py+4);
    }

    y+=cardH+8;

    // =============================================
    // SECCIÓN: PROGRESO META
    // =============================================
    doc.setTextColor(217,95,14);
    doc.setFontSize(12);
    doc.setFont('helvetica','bold');
    doc.text('PROGRESO DE META',mx,y);
    doc.setDrawColor(254,215,170);
    doc.line(mx,y+2,pw-mx,y+2);
    y+=10;

    // Card progreso
    var metaOk=simps.length>=40;
    var pct=Math.min(Math.round((simps.length/40)*100),100);
    doc.setFillColor(248,250,252);
    doc.setDrawColor(226,232,240);
    doc.roundedRect(mx,y,cw,22,3,3,'FD');

    // Número grande
    if(metaOk)doc.setTextColor(13,148,136);
    else doc.setTextColor(217,95,14);
    doc.setFontSize(22);
    doc.setFont('helvetica','bold');
    doc.text(String(simps.length),mx+8,y+14);
    doc.setTextColor(148,163,184);
    doc.setFontSize(10);
    doc.setFont('helvetica','normal');
    doc.text('/ 40 simpatizantes',mx+8+doc.getTextWidth(String(simps.length))+3,y+14);

    // Barra progreso
    var barX=pw/2+5,barW=cw/2-15,barY=y+8,barH=6;
    doc.setFillColor(226,232,240);
    doc.roundedRect(barX,barY,barW,barH,3,3,'F');
    if(pct>0){
      if(metaOk)doc.setFillColor(13,148,136);
      else doc.setFillColor(217,95,14);
      doc.roundedRect(barX,barY,barW*(pct/100),barH,3,3,'F');
    }
    // % texto
    doc.setTextColor(100,116,139);
    doc.setFontSize(8);
    doc.setFont('helvetica','bold');
    doc.text(pct+'%',barX+barW+3,barY+5);

    // Estado meta
    if(metaOk){
      doc.setTextColor(13,148,136);
      doc.setFontSize(8);
      doc.text('META CUMPLIDA',barX,barY+barH+6);
    }else{
      doc.setTextColor(180,83,9);
      doc.setFontSize(8);
      doc.text('FALTAN '+(40-simps.length)+' SIMPATIZANTES',barX,barY+barH+6);
    }

    y+=32;

    // =============================================
    // SECCIÓN: TABLA DE SIMPATIZANTES
    // =============================================
    doc.setTextColor(217,95,14);
    doc.setFontSize(12);
    doc.setFont('helvetica','bold');
    doc.text('LISTADO DE SIMPATIZANTES ('+simps.length+')',mx,y);
    doc.setDrawColor(254,215,170);
    doc.line(mx,y+2,pw-mx,y+2);
    y+=6;

    if(simps.length>0){
      var td=[];
      for(var s=0;s<simps.length;s++){
        td.push([
          s+1,
          (simps[s].nombre||'').substring(0,30),
          simps[s].documento||'',
          simps[s].celular||'',
          (simps[s].barrio||'').substring(0,18),
          (simps[s].municipio||'').substring(0,14),
          simps[s].fechaRegistro||''
        ]);
      }

      doc.autoTable({
        startY:y,
        head:[['#','Nombre','Documento','Celular','Barrio','Municipio','Fecha']],
        body:td,
        styles:{
          fontSize:8,
          cellPadding:{top:2.5,right:3,bottom:2.5,left:3},
          font:'helvetica',
          textColor:[51,65,85],
          lineColor:[226,232,240],
          lineWidth:0.2
        },
        headStyles:{
          fillColor:[217,95,14],
          textColor:[255,255,255],
          fontStyle:'bold',
          fontSize:7.5,
          cellPadding:{top:3,right:3,bottom:3,left:3}
        },
        alternateRowStyles:{fillColor:[248,250,252]},
        margin:{left:mx,right:mx},
        columnStyles:{
          0:{cellWidth:9,halign:'center',fontStyle:'bold',textColor:[148,163,184]},
          1:{cellWidth:40},
          2:{cellWidth:24,font:'courier',fontSize:7.5},
          3:{cellWidth:22},
          4:{cellWidth:26},
          5:{cellWidth:22},
          6:{cellWidth:22}
        },
        tableLineColor:[226,232,240],
        tableLineWidth:0.2,
        didDrawPage:function(data){
          // Footer en cada página
          var pageH=doc.internal.pageSize.getHeight();
          doc.setFillColor(248,250,252);
          doc.rect(0,pageH-16,pw,16,'F');
          doc.setDrawColor(226,232,240);
          doc.setLineWidth(0.3);
          doc.line(0,pageH-16,pw,pageH-16);
          // Línea naranja fina
          doc.setFillColor(217,95,14);
          doc.rect(0,pageH-16,pw,0.5,'F');
          doc.setTextColor(148,163,184);
          doc.setFontSize(7.5);
          doc.setFont('helvetica','normal');
          doc.text('Sistema 40 Caldas  |  '+fc+'  |  Lider: '+(nomL||docL),mx,pageH-6);
          var pNum=doc.internal.getCurrentPageInfo().pageNumber;
          doc.text('Pagina '+pNum,pw-mx,pageH-6,{align:'right'});
        }
      });
    }else{
      doc.setTextColor(148,163,184);
      doc.setFontSize(11);
      doc.setFont('helvetica','normal');
      doc.text('Sin simpatizantes registrados',pw/2,y+15,{align:'center'});
      // Footer primera página si no hay tabla
      doc.setFillColor(248,250,252);
      doc.rect(0,ph-16,pw,16,'F');
      doc.setDrawColor(226,232,240);
      doc.line(0,ph-16,pw,ph-16);
      doc.setFillColor(217,95,14);
      doc.rect(0,ph-16,pw,0.5,'F');
      doc.setTextColor(148,163,184);
      doc.setFontSize(7.5);
      doc.text('Sistema 40 Caldas  |  '+fc,mx,ph-6);
      doc.text('Pagina 1',pw-mx,ph-6,{align:'right'});
    }

    // Descargar
    var fn='40Caldas_'+(nomL||docL).replace(/[^a-zA-Z0-9]/g,'_')+'_Reporte.pdf';
    doc.save(fn);
    mostrarToastAud('PDF descargado: '+fn,'success');
  }catch(err){mostrarToastAud('Error generando PDF: '+err.message,'error');}
}

// ================================================================
// CORREO
// ================================================================
function enviarCorreoLiderAud(doc,nom,correo){
  var cl=(!correo||correo===''||correo==='undefined'||correo==='null')?'':correo;
  if(cl){if(!confirm('Enviar reporte al correo:\n'+cl+'\n\nLider: '+nom))return;}
  else{if(!confirm('Enviar reporte de simpatizantes al lider:\n'+nom+'?\n\nEl correo se buscara en la base de datos.'))return;}

  // Loading contextual con mini-modal
  cerrarModalAud('_auMailLoading');
  var ml=document.createElement('div');ml.id='_auMailLoading';ml.className='au-overlay';
  ml.innerHTML='<div class="au-modal" style="max-width:380px;"><div class="au-modal-head"><h3><span class="au-modal-hicon">'+IC.mail+'</span> Enviando correo</h3></div><div class="au-modal-body" style="text-align:center;padding:40px 28px;"><div style="width:44px;height:44px;border:3px solid var(--au-g200);border-top-color:var(--au-primary);border-radius:50%;animation:auSpin .7s linear infinite;margin:0 auto 16px;"></div><p style="font-size:14px;color:var(--au-g600);margin:0 0 4px;font-weight:600;">Enviando reporte a '+escH(nom)+'</p><p style="font-size:12px;color:var(--au-g400);margin:0;">Esto puede tardar unos segundos...</p></div></div>';
  document.body.appendChild(ml);

  google.script.run.withSuccessHandler(function(r){
    cerrarModalAud('_auMailLoading');
    if(r&&r.success)mostrarToastAud(r.message||'Correo enviado','success');
    else mostrarToastAud('Error: '+(r?r.message:''),'error');
  }).withFailureHandler(function(e){cerrarModalAud('_auMailLoading');mostrarToastAud('Error: '+e.message,'error');}).enviarReporteCorreoLider(doc,nom,cl);
}
</script>
