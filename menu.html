<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>WilCas 40 - Partido de la U Caldas</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
:root {
    --font: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
    --primary: #D95F0E;
    --primary-hover: #C2510A;
    --primary-light: #F97316;
    --primary-50: #FFF8F1;
    --primary-100: #FFEDD5;
    --primary-8: rgba(217, 95, 14, 0.08);
    --primary-12: rgba(217, 95, 14, 0.12);
    --dark: #0F172A;
    --dark-700: #1E293B;
    --gray-50: #F8FAFC;
    --gray-100: #F1F5F9;
    --gray-200: #E2E8F0;
    --gray-300: #CBD5E1;
    --gray-400: #94A3B8;
    --gray-500: #64748B;
    --gray-600: #475569;
    --white: #FFFFFF;
    --success: #0D9488;
    --success-bg: #F0FDFA;
    --info: #2563EB;
    --info-bg: #EFF6FF;
    --radius: 10px;
    --radius-lg: 16px;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 30px rgba(0,0,0,0.10);
    --transition: all 0.2s ease;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    height: 100%;
    font-family: var(--font);
    background: var(--gray-50);
    color: var(--dark);
    -webkit-font-smoothing: antialiased;
}
body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.menu-container {
    width: 100%;
    max-width: 480px;
    text-align: center;
}

/* LOGO PARTIDO DE LA U */
.logo-partido {
    width: 80px;
    height: 80px;
    border-radius: 18px;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: conic-gradient(
        from 200deg,
        #E53E3E,
        #DD6B20,
        #D69E2E,
        #38A169,
        #319795,
        #3182CE,
        #5A67D8,
        #805AD5,
        #E53E3E
    );
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    position: relative;
    overflow: hidden;
}
.logo-partido::after {
    content: 'U';
    font-family: var(--font);
    font-size: 44px;
    font-weight: 800;
    color: var(--white);
    line-height: 1;
    text-shadow: 0 1px 3px rgba(0,0,0,0.15);
}

.menu-container h1 {
    font-size: 28px;
    font-weight: 800;
    color: var(--dark);
    letter-spacing: -0.5px;
    margin-bottom: 4px;
}

.menu-container .subtitle {
    font-size: 14px;
    color: var(--gray-500);
    font-weight: 400;
    margin-bottom: 36px;
}

/* OPCIONES DEL MENÚ */
.menu-options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 36px;
}

.menu-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 20px;
    background: var(--white);
    border: 1.5px solid var(--gray-200);
    border-radius: var(--radius-lg);
    text-decoration: none;
    color: var(--dark);
    transition: var(--transition);
    cursor: pointer;
    box-shadow: var(--shadow);
}

.menu-btn:hover {
    border-color: var(--primary);
    box-shadow: 0 4px 16px var(--primary-12);
    transform: translateY(-2px);
}

.menu-btn:active {
    transform: translateY(0);
}

.menu-btn .btn-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.menu-btn .btn-icon svg {
    width: 20px;
    height: 20px;
    stroke-width: 2;
}

.menu-btn .btn-icon.ic-admin {
    background: var(--primary-100);
    color: var(--primary);
}

.menu-btn .btn-icon.ic-registro {
    background: var(--primary-50);
    color: var(--primary);
}

.menu-btn .btn-icon.ic-llamadas {
    background: var(--primary-50);
    color: var(--primary);
}

.menu-btn .btn-info {
    flex: 1;
    text-align: left;
}

.menu-btn .btn-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--dark);
    letter-spacing: -0.1px;
}

.menu-btn:hover .btn-title {
    color: var(--primary);
}

.menu-btn .btn-role {
    font-size: 12px;
    color: var(--gray-400);
    font-weight: 500;
    flex-shrink: 0;
}

/* FOOTER */
.menu-footer {
    text-align: center;
    padding-top: 20px;
    border-top: 1px solid var(--gray-200);
    font-size: 12px;
    color: var(--gray-400);
    line-height: 1.8;
}
.menu-footer strong { color: var(--dark); font-weight: 700; }
.menu-footer .by { color: var(--primary); font-weight: 600; }

@media (max-width: 480px) {
    body { padding: 16px; }
    .logo-partido { width: 68px; height: 68px; border-radius: 16px; }
    .logo-partido::after { font-size: 38px; }
    .menu-container h1 { font-size: 24px; }
    .menu-btn { padding: 14px 16px; }
}
    </style>
</head>
<body>

<div class="menu-container">

    <!-- LOGO PARTIDO DE LA U -->
    <div class="logo-partido"></div>

    <h1>WilCas 40</h1>
    <p class="subtitle">Partido de la U Caldas</p>

    <!-- OPCIONES -->
    <div class="menu-options">

        <a id="linkAdmin" class="menu-btn" href="{{BASE_URL}}?mode=admin" target="_top">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            </div>
            <div class="btn-info">
                <div class="btn-title">Panel de Administracion</div>
            </div>

        </a>

        <a id="linkRegistro" class="menu-btn" href="{{BASE_URL}}?mode=registro" target="_top">

            </div>
            <div class="btn-info">
                <div class="btn-title">Registro de Simpatizantes</div>
            </div>
            <span class="btn-role">Publico</span>

        <a id="linkLlamadas" class="menu-btn" href="{{BASE_URL}}?mode=llamadas" target="_top">
            <div class="btn-icon ic-llamadas">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </div>
            <div class="btn-info">
                <div class="btn-title">Gestion de Llamadas</div>
            </div>
            <span class="btn-role">Operadores</span>
        </a>

    </div>

    <!-- FOOTER -->
    <div class="menu-footer">
        <strong>WilCas 40</strong> &mdash; Partido de la U Caldas<br>
        Elaborado por <span class="by">Soluciones WilCas</span>
    </div>

</div>

</html>
