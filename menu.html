<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal - U Caldas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff6b00 0%, #ff8c00 25%, #ffb800 50%, #c4d500 75%, #9acd32 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px auto;
            background: linear-gradient(135deg, #ff6b00 0%, #ffb800 25%, #7ed321 50%, #4cd964 75%, #00b4d8 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.3);
        }

        .logo-letter {
            font-size: 48px;
            font-weight: 800;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-option {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #333;
        }

        .menu-option:hover {
            border-color: #ff6b00;
            background: linear-gradient(135deg, rgba(255,107,0,0.1), rgba(255,140,0,0.1));
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,107,0,0.2);
        }

        .menu-option.active {
            border-color: #ff6b00;
            background: linear-gradient(90deg, #ff6b00, #ff8c00, #9acd32);
            color: white;
        }

        .menu-option.active .option-icon {
            background: rgba(255,255,255,0.2);
        }

        .option-icon {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-right: 15px;
            background: #f5f5f5;
        }

        .option-info {
            text-align: left;
            flex: 1;
        }

        .option-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .option-desc {
            font-size: 12px;
            opacity: 0.7;
        }

        .option-arrow {
            font-size: 18px;
            opacity: 0.5;
            transition: all 0.3s;
        }

        .menu-option:hover .option-arrow {
            opacity: 1;
            transform: translateX(5px);
        }

        .footer {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 12px;
            color: #999;
        }

        .footer strong {
            color: #ff6b00;
        }

        .version {
            margin-top: 5px;
            font-size: 11px;
            color: #ccc;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 30px 20px;
                border-radius: 15px;
            }

            .logo {
                width: 70px;
                height: 70px;
            }

            .logo-letter {
                font-size: 42px;
            }

            .title {
                font-size: 20px;
            }

            .menu-option {
                padding: 12px 15px;
            }

            .option-icon {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }

            .option-title {
                font-size: 14px;
            }

            .option-desc {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <span class="logo-letter">U</span>
            </div>
            <h1 class="title">Menú Principal U Caldas</h1>
            <p class="subtitle">Red 40-WilCas • Seleccione una opción</p>

            <div class="menu-options">
                <a href="https://script.google.com/macros/s/AKfycbyxdUb31zFOygX8ladGubiRst3t-Nz78GRY67ivUPPAxbNTfms2SWkmYZVWeUs6fHl-/exec?mode=registro" class="menu-option" target="_top">
                    <div class="option-icon">📝</div>
                    <div class="option-info">
                        <div class="option-title">Registro de Simpatizantes</div>
                        <div class="option-desc">Registrar nuevos simpatizantes</div>
                    </div>
                    <div class="option-arrow">→</div>
                </a>

                <a href="https://script.google.com/macros/s/AKfycbyxdUb31zFOygX8ladGubiRst3t-Nz78GRY67ivUPPAxbNTfms2SWkmYZVWeUs6fHl-/exec?mode=llamadas" class="menu-option" target="_top">
                    <div class="option-icon">📞</div>
                    <div class="option-info">
                        <div class="option-title">Gestión de Llamadas</div>
                        <div class="option-desc">Administrar llamadas a líderes</div>
                    </div>
                    <div class="option-arrow">→</div>
                </a>

                <a href="https://script.google.com/macros/s/AKfycbyxdUb31zFOygX8ladGubiRst3t-Nz78GRY67ivUPPAxbNTfms2SWkmYZVWeUs6fHl-/exec?mode=admin" class="menu-option" target="_top">
                    <div class="option-icon">⚙️</div>
                    <div class="option-info">
                        <div class="option-title">Panel de Administración</div>
                        <div class="option-desc">Estadísticas y reportes</div>
                    </div>
                    <div class="option-arrow">→</div>
                </a>
            </div>

            <div class="footer">
                Desarrollado por <strong>Soluciones WilCas</strong>
                <div class="version">v2.0</div>
            </div>
        </div>
    </div>
</body>
</html>
