<script>
// ================================================================
// DASHBOARD - ESTADÍSTICAS Y MÉTRICAS
// ================================================================
function cargarDashboard() {
  var contenedor = document.getElementById('seccion-dashboard');
  if (!contenedor) return;

  // Calcular estadísticas locales
  var total = datosLlamadas.length;
  var contactados = 0, pendientes = 0, noContesta = 0;
  var totalSimp = 0, lideresConMeta = 0;
  var entidades = {}, comunas = {};

  for (var i = 0; i < datosLlamadas.length; i++) {
    var d = datosLlamadas[i];
    var estado = (d.estadoLlamada || 'pendiente').toLowerCase().trim();
    if (estado === 'contactado' || estado === 'llamado') contactados++;
    else if (estado === 'no contesta') noContesta++;
    else pendientes++;

    var simp = d.cantidadSimpatizantes || 0;
    totalSimp += simp;
    if (simp >= 40) lideresConMeta++;

    var ent = normalizarEntidad(d.entidad);
    if (ent) entidades[ent] = (entidades[ent] || 0) + 1;

    var com = d.comuna || '';
    if (com) comunas[com] = (comunas[com] || 0) + 1;
  }

  var promedio = total > 0 ? Math.round(totalSimp / total) : 0;
  var pctMeta = total > 0 ? Math.round((lideresConMeta / total) * 100) : 0;

  contenedor.innerHTML = '' +
    '<div class="stat-grid">' +
      crearStatCard('Lideres', formatearNumero(total), 'orange', iconLideres()) +
      crearStatCard('Simpatizantes', formatearNumero(totalSimp), 'blue', iconSimpatizantes()) +
      crearStatCard('Contactados', formatearNumero(contactados), 'green', iconContactados()) +
      crearStatCard('Pendientes', formatearNumero(pendientes), 'yellow', iconPendientes()) +
      crearStatCard('No Contesta', formatearNumero(noContesta), 'red', iconNoContesta()) +
      crearStatCard('Meta (40+)', formatearNumero(lideresConMeta), 'green', iconMeta()) +
      crearStatCard('Promedio Simp.', promedio, 'blue', iconPromedio()) +
      crearStatCard('% Meta', pctMeta + '%', 'orange', iconPorcentaje()) +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">' +
      '<div class="card">' +
        '<div class="card-header"><span class="card-title">Lideres por Entidad (Top 10)</span></div>' +
        '<div id="dashEntidades"></div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-header"><span class="card-title">Lideres por Comuna</span></div>' +
        '<div id="dashComunas"></div>' +
      '</div>' +
    '</div>';

  // Renderizar listas
  renderListaOrdenada('dashEntidades', entidades, 10);
  renderListaOrdenada('dashComunas', comunas, 11);
}

function crearStatCard(label, value, color, iconSvg) {
  return '<div class="stat-card">' +
    '<div class="stat-icon ' + color + '">' + iconSvg + '</div>' +
    '<div class="stat-content">' +
      '<div class="stat-value">' + value + '</div>' +
      '<div class="stat-label">' + label + '</div>' +
    '</div>' +
  '</div>';
}

function renderListaOrdenada(containerId, obj, max) {
  var container = document.getElementById(containerId);
  if (!container) return;

  var items = [];
  for (var key in obj) {
    items.push({ name: key, count: obj[key] });
  }
  items.sort(function(a, b) { return b.count - a.count; });
  if (max) items = items.slice(0, max);

  if (items.length === 0) {
    container.innerHTML = '<p style="color:var(--gray-400);font-size:13px;padding:12px;">Sin datos</p>';
    return;
  }

  var maxVal = items[0].count;
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var pct = maxVal > 0 ? Math.round((items[i].count / maxVal) * 100) : 0;
    html += '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray-100);">' +
      '<span style="font-size:12px;color:var(--gray-500);width:24px;text-align:right;">' + (i + 1) + '</span>' +
      '<div style="flex:1;">' +
        '<div style="display:flex;justify-content:space-between;margin-bottom:3px;">' +
          '<span style="font-size:13px;font-weight:500;color:var(--dark);">' + items[i].name + '</span>' +
          '<span style="font-size:13px;font-weight:700;color:var(--primary);">' + items[i].count + '</span>' +
        '</div>' +
        '<div style="height:4px;background:var(--gray-100);border-radius:2px;overflow:hidden;">' +
          '<div style="height:100%;width:' + pct + '%;background:var(--primary);border-radius:2px;transition:width 0.5s ease;"></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }
  container.innerHTML = html;
}

// ========== SVG ICONS ==========
function iconLideres() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>'; }
function iconSimpatizantes() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>'; }
function iconContactados() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'; }
function iconPendientes() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'; }
function iconNoContesta() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15.05 5A5 5 0 0 1 19 8.95M15.05 1A9 9 0 0 1 23 8.94m-1 7.98v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'; }
function iconMeta() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>'; }
function iconPromedio() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>'; }
function iconPorcentaje() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>'; }
</script>
