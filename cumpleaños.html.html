<!-- ==================== JAVASCRIPT MÓDULO CUMPLEAÑOS ==================== -->
<script>
// ========== MÓDULO CUMPLEAÑOS - NAMESPACE AISLADO ==========
const CumpleModule = (function() {
    'use strict';
    
    // Variables privadas del módulo
    let cumpleanosData = [];
    let filtroActual = 'hoy';
    
    // ========== FUNCIONES UTILITARIAS ==========
    function parsearFecha(fecha) {
        if (!fecha) return null;
        
        let parsed = null;
        
        // Formato DD/MM/YYYY
        if (typeof fecha === 'string' && fecha.includes('/')) {
            const partes = fecha.split('/');
            if (partes.length === 3) {
                const dia = parseInt(partes[0], 10);
                const mes = parseInt(partes[1], 10) - 1;
                const anio = parseInt(partes[2], 10);
                parsed = new Date(anio, mes, dia);
            }
        }
        // Formato YYYY-MM-DD
        else if (typeof fecha === 'string' && fecha.includes('-')) {
            const partes = fecha.split('-');
            if (partes.length === 3) {
                parsed = new Date(parseInt(partes[0]), parseInt(partes[1]) - 1, parseInt(partes[2]));
            }
        }
        // Ya es objeto Date
        else if (fecha instanceof Date) {
            parsed = fecha;
        }
        
        return parsed && !isNaN(parsed.getTime()) ? parsed : null;
    }
    
    function abrirWhatsApp(celular, mensaje) {
        let numero = celular.toString().replace(/\D/g, '');
        if (numero.length === 10) {
            numero = '57' + numero;
        }
        const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;
        window.open(url, '_blank');
    }
    
    // ========== VERIFICAR CUMPLEAÑOS ==========
    function verificarCumpleanosHoy() {
        // Verificar que datosLlamadas esté disponible
        if (typeof datosLlamadas === 'undefined' || !datosLlamadas || datosLlamadas.length === 0) {
            setTimeout(verificarCumpleanosHoy, 2000);
            return;
        }
        
        const hoy = new Date();
        const diaHoy = hoy.getDate();
        const mesHoy = hoy.getMonth();
        
        cumpleanosData = datosLlamadas.filter(l => {
            if (!l.fechaNacimiento) return false;
            const fecha = parsearFecha(l.fechaNacimiento);
            return fecha && fecha.getDate() === diaHoy && fecha.getMonth() === mesHoy;
        });
        
        // Actualizar badge en sidebar
        const badge = document.getElementById('badgeCumpleanos');
        if (badge) {
            if (cumpleanosData.length > 0) {
                badge.style.display = 'block';
                badge.textContent = cumpleanosData.length;
            } else {
                badge.style.display = 'none';
            }
        }
        
        // Actualizar alerta en dashboard
        const alertaDashboard = document.getElementById('alertaCumpleanosDashboard');
        if (alertaDashboard) {
            if (cumpleanosData.length > 0) {
                alertaDashboard.style.display = 'flex';
                const textoAlerta = document.getElementById('alertaCumpleanosTexto');
                if (textoAlerta) {
                    textoAlerta.textContent = `🎉 ¡${cumpleanosData.length} líder(es) cumplen años hoy!`;
                }
            } else {
                alertaDashboard.style.display = 'none';
            }
        }
        
        return cumpleanosData.length;
    }
    
    // ========== CAMBIAR TAB ==========
    function cambiarTab(tab, elemento) {
        document.querySelectorAll('.birthday-tab').forEach(t => t.classList.remove('active'));
        if (elemento) {
            elemento.classList.add('active');
        }
        
        filtroActual = tab;
        mostrarLista(tab);
    }
    
    // ========== ACTUALIZAR ==========
    function actualizar() {
        verificarCumpleanosHoy();
        mostrarLista(filtroActual);
        
        if (typeof mostrarAlertaGlobal === 'function') {
            mostrarAlertaGlobal('✅ Cumpleaños actualizados', 'success');
        }
    }
    
    // ========== MOSTRAR LISTA ==========
    function mostrarLista(filtro) {
        const container = document.getElementById('listaCumpleanos');
        
        if (typeof datosLlamadas === 'undefined' || !datosLlamadas) {
            container.innerHTML = `
                <div class="empty-birthday">
                    <div class="empty-birthday-icon">⚠️</div>
                    <p>Datos no disponibles</p>
                </div>
            `;
            return;
        }
        
        const hoy = new Date();
        hoy.setHours(0, 0, 0, 0);
        const diaHoy = hoy.getDate();
        const mesHoy = hoy.getMonth();
        const anioHoy = hoy.getFullYear();
        
        // Filtrar líderes con fecha de nacimiento
        let lideresFiltrados = datosLlamadas.filter(l => l.fechaNacimiento);
        
        // Procesar cada líder
        lideresFiltrados = lideresFiltrados.map(l => {
            const fecha = parsearFecha(l.fechaNacimiento);
            if (!fecha) return null;
            
            // Calcular próximo cumpleaños
            let proximoCumple = new Date(anioHoy, fecha.getMonth(), fecha.getDate());
            proximoCumple.setHours(0, 0, 0, 0);
            
            if (proximoCumple < hoy) {
                proximoCumple = new Date(anioHoy + 1, fecha.getMonth(), fecha.getDate());
            }
            
            const diffTime = proximoCumple.getTime() - hoy.getTime();
            const diasFaltan = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            const edad = anioHoy - fecha.getFullYear();
            const esCumpleanosHoy = fecha.getDate() === diaHoy && fecha.getMonth() === mesHoy;
            
            return {
                ...l,
                fechaParsed: fecha,
                proximoCumple: proximoCumple,
                diasFaltan: diasFaltan,
                edad: esCumpleanosHoy ? edad : (diasFaltan === 0 ? edad : edad),
                esCumpleanosHoy: esCumpleanosHoy
            };
        }).filter(l => l !== null);
        
        // Aplicar filtro según tab
        if (filtro === 'hoy') {
            lideresFiltrados = lideresFiltrados.filter(l => l.esCumpleanosHoy);
        } else if (filtro === 'semana') {
            lideresFiltrados = lideresFiltrados.filter(l => l.diasFaltan <= 7);
        } else if (filtro === 'mes') {
            lideresFiltrados = lideresFiltrados.filter(l => l.diasFaltan <= 30);
        }
        
        // Ordenar por días restantes
        lideresFiltrados.sort((a, b) => a.diasFaltan - b.diasFaltan);
        
        // Si no hay cumpleaños
        if (lideresFiltrados.length === 0) {
            const mensajes = {
                'hoy': 'No hay cumpleaños hoy',
                'semana': 'No hay cumpleaños esta semana',
                'mes': 'No hay cumpleaños este mes',
                'todos': 'No hay líderes con fecha de nacimiento registrada'
            };
            
            container.innerHTML = `
                <div class="empty-birthday">
                    <div class="empty-birthday-icon">📅</div>
                    <p>${mensajes[filtro] || 'No hay cumpleaños'}</p>
                </div>
            `;
            return;
        }
        
        // Construir alerta si hay cumpleaños hoy
        let alertaHoy = '';
        if (filtro === 'hoy' && lideresFiltrados.length > 0) {
            alertaHoy = `
                <div class="birthday-alert">
                    <div class="birthday-alert-icon">🎂</div>
                    <div class="birthday-alert-content">
                        <h3>¡${lideresFiltrados.length} líder(es) cumplen años hoy!</h3>
                        <p>No olvides enviarles un mensaje de felicitación</p>
                    </div>
                </div>
            `;
        }
        
        // Construir lista
        const listaHTML = lideresFiltrados.map(l => {
            const fechaTexto = l.fechaParsed.toLocaleDateString('es-CO', { day: 'numeric', month: 'long' });
            
            let diasTexto = '';
            if (l.esCumpleanosHoy || l.diasFaltan === 0) {
                diasTexto = '🎉 ¡HOY!';
            } else if (l.diasFaltan === 1) {
                diasTexto = '⏰ Mañana';
            } else {
                diasTexto = `📅 En ${l.diasFaltan} días`;
            }
            
            const celularEscaped = (l.celular || '').replace(/'/g, "\\'");
            const nombreEscaped = (l.nombre || '').replace(/'/g, "\\'");
            
            return `
                <div class="birthday-card ${l.esCumpleanosHoy ? 'hoy' : ''}">
                    <div class="birthday-card-info">
                        <div class="birthday-card-avatar">🎂</div>
                        <div class="birthday-card-details">
                            <h4>${l.nombre || 'Sin nombre'}</h4>
                            <p>📅 ${fechaTexto} | 🎈 Cumple ${l.edad} años | ${diasTexto}</p>
                            <p style="font-size: 12px; color: #888; margin-top: 4px;">📱 ${l.celular || 'Sin celular'} | 🏢 ${l.entidad || '-'}</p>
                        </div>
                    </div>
                    <div class="birthday-card-actions">
                        ${l.celular ? `
                            <button class="btn-whatsapp-cumple" onclick="CumpleModule.enviarFelicitacion('${celularEscaped}', '${nombreEscaped}')">
                                📱 Felicitar
                            </button>
                        ` : '<span style="color: #999; font-size: 12px;">Sin celular</span>'}
                    </div>
                </div>
            `;
        }).join('');
        
        container.innerHTML = alertaHoy + listaHTML;
    }
    
    // ========== ENVIAR FELICITACIÓN ==========
    function enviarFelicitacion(celular, nombre) {
        let mensaje = document.getElementById('mensajeCumpleanosPredeterminado').value;
        mensaje = mensaje.replace(/{nombre}/g, nombre);
        abrirWhatsApp(celular, mensaje);
    }
    
    // ========== GUARDAR MENSAJE ==========
    function guardarMensaje() {
        // El mensaje se mantiene en el textarea, no requiere guardado en backend
        if (typeof mostrarAlertaGlobal === 'function') {
            mostrarAlertaGlobal('✅ Mensaje de felicitación actualizado', 'success');
        } else {
            alert('Mensaje de felicitación actualizado');
        }
    }
    
    // ========== FUNCIÓN DE INICIALIZACIÓN ==========
    function init() {
        // Verificar cumpleaños al cargar
        setTimeout(function() {
            verificarCumpleanosHoy();
            mostrarLista('hoy');
        }, 1000);
    }
    
    // ========== API PÚBLICA DEL MÓDULO ==========
    return {
        verificarHoy: verificarCumpleanosHoy,
        cambiarTab: cambiarTab,
        actualizar: actualizar,
        mostrarLista: mostrarLista,
        enviarFelicitacion: enviarFelicitacion,
        guardarMensaje: guardarMensaje,
        init: init,
        
        // Getter para datos
        getCumpleanosHoy: function() { return cumpleanosData; }
    };
})();

// Inicializar cuando el DOM esté listo
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', CumpleModule.init);
} else {
    // Si ya cargó, esperar un poco para que datosLlamadas esté disponible
    setTimeout(CumpleModule.init, 500);
}
</script>
