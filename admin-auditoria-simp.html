@media(max-width:768px){.simp-module{padding:16px}.simp-header{flex-direction:column;align-items:flex-start}.simp-search-row{flex-direction:column}.simp-search-muni{width:100%}.simp-detail-grid{grid-template-columns:1fr}.simp-table{font-size:12px}.simp-table thead th,.simp-table tbody td{padding:8px 8px}.simp-modal{max-width:100%}}

<script>
// ================================================================
// AUDITORÍA SIMPATIZANTES — CON ELIMINAR Y TODOS LOS CAMPOS
// ================================================================
(function(){var t=document.getElementById('_tmpSimpContenido'),d=document.getElementById('seccion-auditoria-simpatizantes');if(t&&d){while(t.firstChild)d.appendChild(t.firstChild);t.parentNode.removeChild(t);console.log('[SIMP] OK')}})();

var paginaSimpAuditoria=1,porPaginaSimpAuditoria=100,totalSimpAuditoria=0,totalPaginasSimpAuditoria=1,cargandoSimpAuditoria=false,timerBusquedaSimp=null,simpYaCargados=false,cacheSimpDetalle={},simpViendoDoc='';

(function(){var o=window.mostrarSeccion;window.mostrarSeccion=function(s){if(typeof o==='function')o.apply(this,arguments);if(s==='auditoria-simpatizantes'&&!simpYaCargados){cargarSimpatizantesAuditoria();simpYaCargados=true}}})();

function cargarSimpatizantesAuditoria(){
    if(cargandoSimpAuditoria)return;cargandoSimpAuditoria=true;simpYaCargados=true;
    var tb=document.getElementById('tablaSimpAuditoriaBody');
    if(tb)tb.innerHTML='<tr><td colspan="9"><div class="simp-loading"><div class="simp-spinner"></div><div class="simp-loading-text">Cargando pagina '+paginaSimpAuditoria+'...</div></div></td></tr>';
    var b=document.getElementById('filtroSimpBusqueda'),m=document.getElementById('filtroSimpMunicipio');
    var filtros={busqueda:b?b.value.trim():'',municipio:m?m.value.trim():''};
    google.script.run.withSuccessHandler(function(r){
        cargandoSimpAuditoria=false;
        if(r&&r.success){totalSimpAuditoria=r.total||0;totalPaginasSimpAuditoria=Math.ceil(totalSimpAuditoria/porPaginaSimpAuditoria)||1;var c=document.getElementById('contadorTotalSimpAuditoria');if(c)c.textContent=totalSimpAuditoria;renderTablaSimp(r.simpatizantes||[],r.total||0)}
        else{var t=document.getElementById('tablaSimpAuditoriaBody');if(t)t.innerHTML='<tr><td colspan="9" style="text-align:center;padding:40px;color:#e53935;">Error: '+(r?r.message:'Sin respuesta')+'</td></tr>'}
    }).withFailureHandler(function(e){cargandoSimpAuditoria=false;var t=document.getElementById('tablaSimpAuditoriaBody');if(t)t.innerHTML='<tr><td colspan="9" style="text-align:center;padding:40px;color:#e53935;">Error: '+(e.message||e)+'</td></tr>'}).obtenerSimpatizantesPaginadosV2(paginaSimpAuditoria,porPaginaSimpAuditoria,filtros);
}

function renderTablaSimp(datos,total){
    var tb=document.getElementById('tablaSimpAuditoriaBody');if(!tb)return;
    var ini=(paginaSimpAuditoria-1)*porPaginaSimpAuditoria,h='';
    if(!datos||datos.length===0){h='<tr><td colspan="9" style="text-align:center;padding:40px;color:#8a8fa3;">Sin registros</td></tr>'}
    else{for(var i=0;i<datos.length;i++){var s=datos[i];var key=s.documento||('i'+i);cacheSimpDetalle[key]=s;
        h+='<tr><td class="simp-cell-num">'+(ini+i+1)+'</td><td class="simp-cell-name">'+X(s.nombre)+'</td><td>'+X(s.documento)+'</td><td>'+X(s.celular)+'</td><td>'+X(s.municipio)+'</td><td class="simp-cell-small">'+X(s.barrio)+'</td><td class="simp-cell-small">'+X(s.liderNombre||s.liderDocumento||'')+'</td><td class="simp-cell-small">'+X(s.fechaRegistro)+'</td>';
        h+='<td><div class="simp-cell-actions">';
        h+='<button class="simp-btn-action simp-btn-ver" title="Ver detalle" onclick="verSimp(\''+X(key)+'\')"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>';

function eliminarSimp(docSimp,nombre,docLider){
    if(!docSimp){
        if(typeof mostrarToastAud==='function')mostrarToastAud('Documento del simpatizante no disponible','error');
        else alert('Documento del simpatizante no disponible');
        return;
    }
    if(!confirm('¿Eliminar simpatizante?\n\nNombre: '+(nombre||docSimp)+'\nDocumento: '+docSimp+'\n\nEsta accion es irreversible.'))return;

    // Mostrar loading en la fila (visual feedback)
    if(typeof mostrarLoading==='function')mostrarLoading('Eliminando simpatizante...');

    google.script.run.withSuccessHandler(function(r){
        if(typeof ocultarLoading==='function')ocultarLoading();
        if(r&&r.success){
            if(typeof mostrarToastAud==='function')mostrarToastAud('Simpatizante eliminado correctamente','success');
            else alert('Simpatizante eliminado correctamente');
            // Limpiar del cache local
            if(cacheSimpDetalle[docSimp])delete cacheSimpDetalle[docSimp];
            cargarSimpatizantesAuditoria();
        }else{
            if(typeof mostrarToastAud==='function')mostrarToastAud('Error: '+(r?r.message:''),'error');
            else alert('Error: '+(r?r.message:''));
        }
    }).withFailureHandler(function(e){
        if(typeof ocultarLoading==='function')ocultarLoading();
        if(typeof mostrarToastAud==='function')mostrarToastAud('Error: '+(e.message||e),'error');
        else alert('Error: '+(e.message||e));
    }).eliminarSimpatizanteWrapper(docSimp,docLider);
}

function exportarCSVSimpatizantes(){var t=document.getElementById('tablaSimpAuditoriaBody');if(!t||!t.rows||t.rows.length===0){alert('No hay datos');return}var csv='No,Nombre,Documento,Celular,Municipio,Barrio,Lider,Fecha\n';for(var i=0;i<t.rows.length;i++){var c=t.rows[i].cells;if(c.length<8)continue;var f='';for(var j=0;j<8;j++){f+='"'+(c[j].textContent||'').replace(/"/g,'""')+'"';if(j<7)f+=','}csv+=f+'\n'}var b=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='simpatizantes_pag'+paginaSimpAuditoria+'.csv';a.click();URL.revokeObjectURL(u)}

function exportarCSVTodosSimpatizantes(){
    if(totalSimpAuditoria===0){alert('No hay datos.');return}
    if(!confirm('Exportar '+totalSimpAuditoria+' registros?'))return;
    var tb=document.getElementById('tablaSimpAuditoriaBody');
    var orig=tb?tb.innerHTML:'';
    if(tb){tb.innerHTML='<tr><td colspan="9"><div class="simp-loading"><div class="simp-spinner"></div><div class="simp-loading-text">Exportando...</div></div></td></tr>'}
    var b=document.getElementById('filtroSimpBusqueda');
    var m=document.getElementById('filtroSimpMunicipio');
    google.script.run
        .withSuccessHandler(function(r){
            if(tb)tb.innerHTML=orig;
            if(r&&r.success&&r.simpatizantes){
                var csv='Nombre,Documento,Celular,Municipio,Barrio,Lider,Fecha\n';
                for(var i=0;i<r.simpatizantes.length;i++){
                    var s=r.simpatizantes[i];
                    csv+='"'+(s.nombre||'')+'",'
                        +'"'+(s.documento||'')+'",'
                        +'"'+(s.celular||'')+'",'
                        +'"'+(s.municipio||'')+'",'
                        +'"'+(s.barrio||'')+'",'
                        +'"'+(s.liderNombre||'')+'",'
                        +'"'+(s.fechaRegistro||'')+'"\n';
                }
                var bl=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
                var u=URL.createObjectURL(bl);
                var a=document.createElement('a');
                a.href=u;a.download='simpatizantes_COMPLETO.csv';a.click();URL.revokeObjectURL(u);
            }else{alert('Error: '+(r?r.message:''))}
        })
        .withFailureHandler(function(e){
            if(tb)tb.innerHTML=orig;
            alert('Error: '+(e.message||e));
        })
        .obtenerSimpatizantesParaExportar(b?b.value.trim():'',m?m.value.trim():'');
}
